name: Run Build Tests
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  build_tests:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@dev
    secrets: inherit
    with:
      python_versions: '["3.10","3.11","3.12","3.13","3.14"]'
      install_extras: 'test'
      test_path: 'test'
      # Native tool-calling needs the tool contract (ToolCall, tools=, supports_tools,
      # ToolBox.normalize_tools). Install the plugin-manager branch until it releases.
      pre_install_pip: "git+https://github.com/OpenVoiceOS/ovos-plugin-manager@feat/agent-tool-calling"
