[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos_openai_plugin"
dynamic = ["version"]
description = "OpenAI-compatible agent plugins for OpenVoiceOS (chat, summarizer, translation, dialog transformer)"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "JarbasAi", email = "jarbasai@mailfence.com" }]
requires-python = ">=3.10"
keywords = ["ovos", "plugin", "openai", "llm", "agent"]
dependencies = [
    "requests",
    "ovos-plugin-manager>=2.2.3a1,<3.0.0",
    "ovos-utils>=0.3.5,<1.0.0",
    "ovos-config>=0.2.0,<1.0.0",
    "sentence-stream>=1.0.0,<2.0.0",
    "langcodes[data]",
]

[project.optional-dependencies]
test = [
    "ovoscope>=0.13.1",
    "pytest>=7.0.0,<9",
    "pytest-timeout>=2.0.0",
    "ovos-persona>=0.9.0a1",
    "fastapi",
    "uvicorn",
]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-openai-plugin"

[project.entry-points."opm.agents.chat"]
"ovos-chat-openai-plugin" = "ovos_openai_plugin.chat:OpenAIChatEngine"

[project.entry-points."opm.agents.memory"]
"ovos-openai-rag-memory-plugin" = "ovos_openai_plugin.rag_memory:PersonaServerRAGMemory"

[project.entry-points."opm.agents.summarizer"]
"ovos-summarizer-openai-plugin" = "ovos_openai_plugin.summarizer:OpenAISummarizer"

[project.entry-points."opm.transformer.dialog"]
"ovos-dialog-transformer-openai-plugin" = "ovos_openai_plugin.dialog_transformers:OpenAIDialogTransformer"

[project.entry-points."opm.lang.translate"]
"ovos-translate-openai-plugin" = "ovos_openai_plugin.translate:OpenAITextTranslator"

[project.entry-points."opm.lang.detect"]
"ovos-lang-detect-openai-plugin" = "ovos_openai_plugin.translate:OpenAITextLangDetector"

[project.entry-points."opm.plugin.persona"]
"Remote Llama" = "ovos_openai_plugin:LLAMA_DEMO"

[tool.setuptools.dynamic]
version = { attr = "ovos_openai_plugin.version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["ovos_openai_plugin*"]
