name: End2End Tests
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  ovoscope:
    uses: OpenVoiceOS/gh-automations/.github/workflows/ovoscope.yml@dev
    secrets: inherit
    with:
      python_version: '3.11'
      install_extras: 'test'
      test_path: 'test/end2end/'
      # The chat + RAG-memory plugins need the tool-calling contract (ToolCall,
      # tools=, supports_tools). Install the plugin-manager branch until it releases.
      pre_install_pip: "git+https://github.com/OpenVoiceOS/ovos-plugin-manager@feat/agent-tool-calling"
