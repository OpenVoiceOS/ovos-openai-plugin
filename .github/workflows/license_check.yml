name: License Check

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  license_check:
    uses: OpenVoiceOS/gh-automations/.github/workflows/license-check.yml@dev
    secrets: inherit
    with:
      # marisa-trie is "MIT AND (BSD-2-Clause OR LGPL-2.1-or-later)" — a transitive
      # dep usable under BSD-2-Clause (safe as a library); the LGPL option trips the
      # WeakCopyleft check. Anchor name + optional version separator (see tqdm regex bug).
      exclude_packages: "^marisa-trie(?:[:=]|$)"
